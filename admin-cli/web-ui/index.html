<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChemStock Admin</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/vendor/phosphor/regular/style.css" />
  <link rel="stylesheet" href="/vendor/phosphor/fill/style.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="/shared/keyStrength.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Login -->
  <div id="login-screen" class="login-screen" hidden>
    <form id="login-form" class="login-card glass" autocomplete="off">
      <div class="login-logo"><img src="assets/logo.png" alt="" /></div>
      <h1 class="login-brand">CHEMSTOCK</h1>
      <p class="login-sub">Administration Console</p>
      <label class="field-label" for="admin-password">Admin password</label>
      <div class="input-icon">
        <i class="ph ph-lock-simple"></i>
        <input id="admin-password" class="input" type="password" autocomplete="current-password" required />
      </div>
      <p id="login-error" class="login-error" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit"><i class="ph ph-sign-in"></i> Log in</button>
      <p class="login-hint">Forgot it? Run <code>npm run set-password</code> in the admin-cli folder.</p>
    </form>
  </div>

  <!-- App -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo"><img src="assets/logo.png" alt="ChemStock" /></div>
        <div>
          <div class="brand-name">CHEMSTOCK</div>
          <div class="brand-sub">Admin Console</div>
        </div>
      </div>

      <nav class="nav" aria-label="Main">
        <button class="nav-item" data-view="dashboard"><i class="ph ph-squares-four"></i><span>Dashboard</span></button>
        <button class="nav-item" data-view="keys"><i class="ph ph-key"></i><span>Activation Keys</span></button>
        <button class="nav-item" data-view="generate"><i class="ph ph-plus-circle"></i><span>Generate Key</span></button>
        <button class="nav-item" data-view="managers"><i class="ph ph-users-three"></i><span>Managers</span></button>
        <button class="nav-item" data-view="branches"><i class="ph ph-buildings"></i><span>Branches</span></button>
        <button class="nav-item" data-view="audit"><i class="ph ph-scroll"></i><span>Activation Log</span></button>
        <button class="nav-item" data-view="activity"><i class="ph ph-user-list"></i><span>Admin Activity</span></button>
      </nav>

      <div class="sidebar-footer">
        <div class="whoami"><div class="avatar" id="whoami-avatar">?</div><div><div class="whoami-name" id="whoami-name">—</div><div class="whoami-role">Signed in</div></div></div>
        <button class="nav-item nav-logout" data-action="logout"><i class="ph ph-sign-out"></i><span>Log out</span></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="page-title" class="page-title">Dashboard</h1>
          <p id="page-sub" class="page-sub"></p>
        </div>
        <div class="topbar-right">
          <span id="connection" class="pill pill-ok"><span class="dot"></span><span id="connection-text">Connected</span></span>
          <span id="clock" class="clock"></span>
        </div>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>

  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>
</body>
</html>
